<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/css/base.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', path='/css/header.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', path='/css/components.css') }}?v=20260711-task2" />
  {% block page_styles %}{% endblock %}
  <link rel="stylesheet" href="{{ url_for('static', path='/css/responsive.css') }}?v=20260711-r1" />
</head>
<body{% block body_class_attr %}{% endblock %}>
  <div class="page-shell{% block shell_class_attr %}{% endblock %}">
    <header class="header">
      <div class="container header-inner">
        <a class="brand" href="/" aria-label="StreamDock 首页" data-transition-link>
          <span class="brand-mark"></span>
          <span>StreamDock</span>
        </a>

        <nav class="nav" aria-label="主导航">
          <a class="nav-link {% if active_nav == 'home' %}active{% endif %}" href="/" data-transition-link>产品</a>
          <a class="nav-link {% if active_nav == 'platforms' %}active{% endif %}" href="/platforms" data-transition-link>支持平台</a>
          <a class="nav-link {% if active_nav == 'use' %}active{% endif %}" href="/use" data-transition-link>视频解析</a>
          <a class="nav-link {% if active_nav == 'convert' %}active{% endif %}" href="/convert" data-transition-link>文件转换</a>
          <a class="nav-link {% if active_nav == 'pdf' %}active{% endif %}" href="/pdf" data-transition-link>PDF解析</a>
          <a class="nav-link" href="/#updates" data-scroll-target="updates">更新日志</a>
        </nav>

        <div class="header-actions">
          <button class="top-btn github" id="githubBtn" type="button" data-repository-url="" title="项目仓库尚未配置">
            <svg class="github-mark" viewBox="0 0 16 16" aria-hidden="true">
              <path fill="currentColor" d="M8 0C3.58 0 0 3.67 0 8.2c0 3.62 2.29 6.69 5.47 7.77.4.08.55-.18.55-.4 0-.2-.01-.85-.01-1.54-2.01.38-2.53-.5-2.69-.96-.09-.23-.48-.96-.82-1.16-.28-.15-.68-.52-.01-.53.63-.01 1.08.59 1.23.84.72 1.24 1.87.89 2.33.68.07-.53.28-.89.51-1.09-1.78-.21-3.64-.91-3.64-4.03 0-.89.31-1.62.82-2.19-.08-.21-.36-1.04.08-2.16 0 0 .67-.22 2.2.84A7.43 7.43 0 0 1 8 4c.68 0 1.36.09 2 .27 1.53-1.06 2.2-.84 2.2-.84.44 1.12.16 1.95.08 2.16.51.57.82 1.3.82 2.19 0 3.13-1.87 3.82-3.65 4.03.29.26.54.75.54 1.51 0 1.09-.01 1.97-.01 2.24 0 .22.15.48.55.4A8.1 8.1 0 0 0 16 8.2C16 3.67 12.42 0 8 0Z" />
            </svg>
            <span>GitHub</span>
          </button>
          <button class="top-btn download" id="topDownloadBtn" type="button">在线使用</button>
        </div>
      </div>
    </header>

    {% block page_content %}{% endblock %}
  </div>

  <div class="toast" id="toast"></div>

  <div class="task-detail-layer" id="taskDetailLayer" hidden>
    <button class="task-detail-backdrop" type="button" data-task-detail-close aria-label="关闭任务详情"></button>
    <aside class="task-detail-drawer" role="dialog" aria-modal="true" aria-labelledby="taskDetailTitle">
      <header class="task-detail-header">
        <div>
          <p>任务详情</p>
          <h2 id="taskDetailTitle">本地任务</h2>
        </div>
        <button class="task-detail-close" type="button" data-task-detail-close aria-label="关闭任务详情">×</button>
      </header>
      <div class="task-detail-content" id="taskDetailContent"></div>
      <footer class="task-detail-footer" id="taskDetailFooter"></footer>
    </aside>
  </div>

  <script src="{{ url_for('static', path='/js/main.js') }}"></script>
  {% block page_scripts %}{% endblock %}
</body>
</html>
