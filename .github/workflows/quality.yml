name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-311:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install native conversion engines
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libreoffice libarchive-tools
      - name: Install declared test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock-py311.txt
          python -m pip check
      - name: Run Python regression suite
        run: python -m pytest -q
      - name: Run real-file conversion matrix
        run: |
          python scripts/test_conversion_robustness.py
          python scripts/test_conversion_matrix_real.py
          python scripts/fetch_complex_conversion_corpus.py
          python scripts/test_conversion_complex_corpus.py --local-manifest /tmp/streamdock-no-local-corpus.json
          python scripts/verify_conversion_release.py
      - name: Check browser scripts
        run: find static/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Install Chromium for frontend workflow regression
        run: python -m playwright install --with-deps chromium
      - name: Run real-browser frontend workflow regression
        run: |
          python scripts/test_frontend_m5_browser.py
          python scripts/test_frontend_m6_browser.py
          python scripts/test_frontend_m8_browser.py
          python scripts/test_frontend_m9_browser.py
      - name: Upload conversion quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conversion-quality-${{ github.sha }}
          path: report_figures/*.json
          if-no-files-found: error
          retention-days: 30
